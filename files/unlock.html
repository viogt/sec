<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload an Excel File</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js"></script>
    <style>
        .container {
            max-width: 420px;
            margin: auto;
            padding: 24px;
            background-color: #fff;
            font:
                normal 15px Arial, sans-serif;
        }

        svg,
        .deasupra {
            grid-area: 1 / 1;
            width: 100%;
        }

        .hdr {
            display: grid;
            grid-template-columns: 1fr 3fr;
            gap: 12px;
            margin-bottom: 1em;
        }

        .xlsx {
            display: inline-block;
            background: url("data:image/svg+xml,%3Csvg width='100%' viewBox='0 0 32 32' xmlns='http://www.w3.org/2000/svg' fill='%23000000'%3E%3Cg id='SVGRepo_bgCarrier' stroke-width='0'%3E%3C/g%3E%3Cg id='SVGRepo_tracerCarrier' stroke-linecap='round' stroke-linejoin='round'%3E%3C/g%3E%3Cg id='SVGRepo_iconCarrier'%3E%3Ctitle%3Efile_type_excel2%3C/title%3E%3Cpath d='M28.781,4.405H18.651V2.018L2,4.588V27.115l16.651,2.868V26.445H28.781A1.162,1.162,0,0,0,30,25.349V5.5A1.162,1.162,0,0,0,28.781,4.405Zm.16,21.126H18.617L18.6,23.642h2.487v-2.2H18.581l-.012-1.3h2.518v-2.2H18.55l-.012-1.3h2.549v-2.2H18.53v-1.3h2.557v-2.2H18.53v-1.3h2.557v-2.2H18.53v-2H28.941Z' style='fill:%23008000;fill-rule:evenodd'%3E%3C/path%3E%3Crect x='22.487' y='7.439' width='4.323' height='2.2' style='fill:%23008000'%3E%3C/rect%3E%3Crect x='22.487' y='10.94' width='4.323' height='2.2' style='fill:%23008000'%3E%3C/rect%3E%3Crect x='22.487' y='14.441' width='4.323' height='2.2' style='fill:%23008000'%3E%3C/rect%3E%3Crect x='22.487' y='17.942' width='4.323' height='2.2' style='fill:%23008000'%3E%3C/rect%3E%3Crect x='22.487' y='21.443' width='4.323' height='2.2' style='fill:%23008000'%3E%3C/rect%3E%3Cpolygon points='6.347 10.673 8.493 10.55 9.842 14.259 11.436 10.397 13.582 10.274 10.976 15.54 13.582 20.819 11.313 20.666 9.781 16.642 8.248 20.513 6.163 20.329 8.585 15.666 6.347 10.673' style='fill:%23ffffff;fill-rule:evenodd'%3E%3C/polygon%3E%3C/g%3E%3C/svg%3E") no-repeat;
            aspect-ratio: 1 / 1;
        }

        .xlsx-title {
            font: bold 24px Arial, sans-serif;
            color: green;
            margin-bottom: 8px;
        }

        .sm-hdr {
            display: grid;
            grid-template-columns: 26px 1fr;
            gap: 9px;
            padding: 1em 0;
        }

        .sm-hdr-title {
            margin-top: 4px;
            font: bold 18px Arial, sans-serif;
            color: green;
        }

        #percentage-text {
            font-size: 28px;
            font-weight: bold;
            fill: #bdb;
            text-anchor: middle;
        }

        input[type="file"] {
            font-size: 16px;
            color: green;
        }

        ::file-selector-button {
            border: none;
            padding: 5px 12px;
            border-radius: 13px;
            background: green;
            color: #fff;
        }

        b {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 16 16' height='16' width='16' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='8' cy='6.5' r='3.1' stroke='black' stroke-width='1.6' fill='none'/%3E%3Crect x='3' y='6.8' width='10' height='6.8' rx='1' fill='black'/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: 2px 0;
            background-size: 20px;
            font-weight: normal;
            background-color: #fb5;
            box-shadow: 0 2px 4px #444;
            padding: 2px 6px 2px 24px;
            border-radius: 6px;
        }

        b[lilac] {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 16 16' height='16' width='16' xmlns='http://www.w3.org/2000/svg'%3E%3Cg stroke='black' fill='none'%3E%3Cpath d='M1 8 Q8 0 15 8 Q8 16 1 8z' stroke-width='.6' stroke-linejoin='round'/%3E%3Ccircle cx='8' cy='8' r='2.4' fill='black'/%3E%3Cpath d='M3 13 L13 3' stroke-width='1.8' stroke='darkred' stroke-linecap='round'/%3E%3C/g%3E%3C/svg%3E");
            background-color: #fe2;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            border-top: 0.8px solid #ccc;
        }

        td {
            vertical-align: top;
            border-bottom: 0.8px solid #ccc;
            padding: 6px 2px;
        }

        span {
            color: #c00;
        }

        p {
            background: url("data:image/svg+xml,%3Csvg fill='%23008000' width='64px' height='64px' viewBox='-4 0 32 32' version='1.1' xmlns='http://www.w3.org/2000/svg' stroke='%23008000'%3E%3Cg id='SVGRepo_bgCarrier' stroke-width='0'%3E%3C/g%3E%3Cg id='SVGRepo_tracerCarrier' stroke-linecap='round' stroke-linejoin='round'%3E%3C/g%3E%3Cg id='SVGRepo_iconCarrier'%3E%3Ctitle%3Echeck%3C/title%3E%3Cpath d='M19.375 5.063l-9.5 13.625-6.563-4.875-3.313 4.594 11.188 8.531 12.813-18.375z'%3E%3C/path%3E%3C/g%3E%3C/svg%3E") no-repeat 2px/19px;
            margin: 0;
            padding: 4px 0 4px 24px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="hdr">
            <div class="xlsx"></div>
            <div>
                <div class="xlsx-title">Upload an .xlsx file</div>
                <input type="file" id="fileInput" accept=".xlsx" onchange="uploadFile()" />
            </div>
        </div>
        <div style="display: grid;">
            <svg viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45" fill="none" stroke="#eee" stroke-width="10" />
                <path id="percentage-arc" fill="none" stroke="#bdb" stroke-width="10" stroke-linecap="round" />
                <text id="percentage-text" x="50" y="60">0%</text>
            </svg>
            <div class="deasupra" id="message"></div>
        </div>
        <div id="showSVG"></div>
        <div id="rezultat"></div>
        <svg width="300px" height="18" xmlns="http://www.w3.org/2000/svg">
            <text id="masura" x="0" y="18" font-family="Arial,sans-serif" font-size="18" opacity="0"></text>
        </svg>
    </div>

    <script>
        const log = document.getElementById("message");
        const bar = document.getElementById("bar");
        const rezultat = document.getElementById("rezultat");
        const fileInput = document.getElementById("fileInput");
        const showSVG = document.getElementById('showSVG');

        const rgx = /xl\/worksheets\/sheet\d+\.xml/;
        const zip = new JSZip();
        const parser = new DOMParser();
        const xmlSerializer = new XMLSerializer();

        var fileToDownload, progress;

        function sendProg(cod, mssg) {
            if (cod < 0) {
                rezultat.innerHTML = mssg;
                setTimeout(() => {
                    rezultat.scrollIntoView({ behavior: 'smooth', block: 'end' });
                }, 50);
                return;
            }
            progress += cod; if (progress > 100) progress = 100;
            percent = progress.toFixed(0) + "%";
            const el = document.createElement("p");
            el.innerHTML = mssg;
            log.appendChild(el);
            arcElement.setAttribute('d', describeArc(progress));
            textElement.textContent = percent;
        }

        async function uploadFile() {
            const file = fileInput.files[0];
            if (!file) return;

            const foi = [], foiAdd = [];
            let modified = false, perSheet;
            progress = 0;
            log.innerHTML = "";
            rezultat.innerHTML = "";
            showSVG.innerHTML = '';

            const arrayBuffer = await file.arrayBuffer();
            const contents = await zip.loadAsync(arrayBuffer);
            sendProg(8, "File loaded.");

            for (const [pth, file] of Object.entries(contents.files)) {
                if (pth === "xl/workbook.xml") {
                    let change = false;
                    const buf = await file.async("text");
                    const doc = parser.parseFromString(buf, "text/xml");
                    const wkProt = doc.querySelector("workbookProtection");
                    if (wkProt) {
                        wkProt.remove();
                        change = true;
                    }
                    sendProg(
                        8,
                        `Workbook ${wkProt ? "<span>unlocked</span>" : "is not locked"}.`
                    );
                    const sheets = doc.querySelectorAll("sheets > sheet");
                    for (const sheet of sheets) {
                        foi.push({
                            name: sheet.getAttribute("name"),
                            state: sheet.getAttribute("state"),
                            id: sheet.getAttribute("r:id"),
                        });
                    }
                    let sCnt = 0, hid;
                    perSheet = 80 / sheets.length / 2;
                    for (const sheet of sheets) {
                        hid = sheet.getAttribute("state") === "hidden";
                        if (hid) {
                            sheet.removeAttribute("state");
                            change = true;
                            sCnt++;
                        }
                        sendProg(
                            perSheet,
                            `Sheet <u>${sheet.getAttribute("name")}</u> ${hid ? "<span>unhidden</span>" : "not hidden"
                            }.`
                        );
                    }
                    if (change) {
                        zip.file(pth, xmlSerializer.serializeToString(doc));
                        modified = true;
                    }
                }

                else if (rgx.test(pth)) {
                    const buf = await file.async("text");
                    const doc = parser.parseFromString(buf, "text/xml");
                    const prt = doc.querySelector("sheetProtection");
                    foiAdd.push({ pth: pth, prot: prt ? true : false });
                    if (prt) {
                        prt.remove();
                        zip.file(pth, xmlSerializer.serializeToString(doc));
                        modified = true;
                    }
                    sendProg(
                        perSheet, `Sheet <u>${pth.slice(
                            pth.lastIndexOf("/") + 1
                        )}</u> ${prt ? "<span>unprotected</span>" : "not protected"}.`
                    );
                }
            }
            sendProg(100, "Processing complete.")
            if (!modified) {
                sendProg(-1,
                    "<div class='sm-hdr'><div class='xlsx'></div><div class='sm-hdr-title'>THIS FILE IS NOT LOCKED.</div></div>"
                );
                return;
            }
            fileToDownload = await zip.generateAsync({
                type: "blob",
                compression: "DEFLATE",
                compressionOptions: { level: 9 },
            });
            sendProg(-1, show(foi, foiAdd));
            getSVG(showSVG);
        }

        function show(foi, foiAdd) {
            for (el of foiAdd) {
                const num = parseInt(el.pth.match(/\d+\.xml$/)[0]) - 1;
                foi[num].prot = el.prot;
            }
            let num = 1;
            let str = "<div class='sm-hdr'><div class='xlsx'></div><div class='sm-hdr-title'>FILE UNLOCKED:</div></div><table>";
            for (el of foi) {
                str += `<tr><td>${num}</td><td align="left">${el.name}</td><td>${el.state == "hidden" ? "<b lilac>hidden</b>" : "—"
                    }</td><td>${el.prot ? "<b>protected</b>" : "—"}</td></tr>`;
                num++;
            }
            return (
                str +
                "</table><div class='sm-hdr'><div class='xlsx'></div><a class='sm-hdr-title' href='#' onclick='save(this);return false;'>DOWNLOAD UNLOCKED</a></div>"
            );
        }
        /* ---------------- progress circular ---------------- */
        const CENTER_X = 50;
        const CENTER_Y = 50;
        const RADIUS = 45;

        const arcElement = document.getElementById('percentage-arc');
        const textElement = document.getElementById('percentage-text');

        function polarToCartesian(angleInDegrees) {
            const angleInRadians = (angleInDegrees - 90) * Math.PI / 180.0;
            return {
                x: CENTER_X + (RADIUS * Math.cos(angleInRadians)),
                y: CENTER_Y + (RADIUS * Math.sin(angleInRadians))
            };
        }

        function describeArc(percentage) {
            const endAngle = percentage * 3.6;
            const start = polarToCartesian(0);
            const end = polarToCartesian(endAngle);
            const largeArcFlag = endAngle <= 180 ? "0" : "1";
            const sweepFlag = "1";
            if (percentage === 100) {
                const d = [
                    `M ${start.x} ${start.y}`,
                    `A ${RADIUS} ${RADIUS} 0 1 1 ${start.x - 0.01} ${start.y}`
                ].join(' ');
                return d;
            }
            const d = [
                `M ${start.x} ${start.y}`,
                `A ${RADIUS} ${RADIUS} 0 ${largeArcFlag} ${sweepFlag} ${end.x} ${end.y}`
            ].join(' ');

            return d;
        }
        function save(obj) {
            const a = document.createElement('a');
            const url = URL.createObjectURL(fileToDownload);
            a.href = url;
            a.download = "unlocked.xlsx";
            document.body.appendChild(a); // needed for Firefox
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        function getSVG(undeScrie) {
            const fontSize = 18, padding = 18;
            const bLine = 260, labLine = 10;
            let buf = '';
            const foi = [
                { name: "Дюрация", state: "hidden" },
                { name: "ФОРМА СКБСЖ", state: "protected" },
                { name: "Свод", state: "" },
                { name: "Каналы", state: "" },
                { name: "Регионы", state: "protected" },
                { name: "спр", state: "hidden" },
                { name: "ЛБ", state: "protected" }
            ];

            const masura = document.getElementById('masura');

            const cul = ['#ffa', '#afa', '#bbf', '#aff', '#fcf'];
            const culLem = cul.length;
            const LEN = foi.length;
            let svgLen = padding * 2;
            for (const e of foi) {
                masura.textContent = e.name;
                e.len = masura.getComputedTextLength();
                svgLen += e.len + padding * 2;
            }

            const unh = "Unhidden", unp = "Unpotected";
            masura.textContent = unh;
            const hLen = masura.getComputedTextLength();
            masura.textContent = unp;
            const pLen = masura.getComputedTextLength();

            const lHeight = fontSize + padding * 2;
            const dif = (svgLen - (hLen + pLen + padding * 4)) / 3;
            const pXpos = dif + hLen + dif;
            const hidX = dif + padding + hLen / 2, procX = pXpos + padding + pLen / 2;
            const bottom = lHeight + labLine;

            let curPos = svgLen - padding;
            for (let i = LEN - 1; i >= 0; i--) {
                const e = foi[i];
                const w = e.len + padding * 2, h = padding * 2 + fontSize;
                curPos -= w;
                buf += `<path d="M${curPos} ${bLine} h${w + padding} l-${padding * 2} ${h} H${curPos} v-${h}z" fill="${cul[i % culLem]}" stroke="#000" stroke-width="1"/>\n`;
                if (e.state.includes('hidden')) {
                    const xx = curPos + padding + e.len / 2, yy = bLine + fontSize + padding * 2;
                    buf += `<path d="M${hidX} ${bottom} Q${hidX + (xx - hidX) * .8} ${bottom + (bLine - bottom) * .2} ${xx} ${bLine}" stroke="#333" stroke-width="2" fill="none" stroke-dasharray="8" marker-end="url(#arrow)"/>`;
                    buf += `<use href="#hidden" x="${xx - 18}" y="${yy - padding / 2}"/>`;
                }
                else if (e.state.includes('protected')) {
                    const xx = curPos + padding + e.len / 2, yy = bLine + fontSize + padding * 2;
                    //buf += `<path d="M${procX} ${bottom} L${xx} ${bLine}" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>`;
                    buf += `<path d="M${procX} ${bottom} Q${procX + (xx - procX) * .8} ${bottom + (bLine - bottom) * .2} ${xx} ${bLine}" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>`;
                    buf += `<use href="#protect" x="${xx - 18}" y="${yy - padding / 2}"/>`;
                }
                buf += `<text x="${curPos + padding}" y="${bLine + padding + fontSize}">${e.name}</text>\n`;
            }

            buf += `<rect x="${dif}" y="${labLine + padding / 4}" width="${hLen + padding * 2}" height="${lHeight}" rx="${lHeight / 2}" fill="#f80" />`;
            buf += `<text x="${dif + padding}" y="${labLine + padding + fontSize}" fill="#fff">${unh}</text>\n`;

            buf += `<rect x="${dif + hLen + dif}" y="${labLine + padding / 4}" width="${pLen + padding * 2}" height="${lHeight}" rx="${lHeight / 2}" fill="#b20" />`;
            buf += `<text x="${pXpos + padding}" y="${labLine + padding + fontSize}" fill="#fff">${unp}</text>\n`;


            buf = `<svg viewBox="0 0 ${svgLen} ${bLine + fontSize + padding * 2 + 36}" width="100%" xmlns="http://www.w3.org/2000/svg">
                <style>text { font-size: ${fontSize}px; font-family: Arial, sans-serif; }</style>
                <defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
                <path d="M0 0 L6 3 L0 6z" fill="#333" /></marker>
                <g id="protect">
      <circle cx="18" cy="18" r="17" fill="#fff" stroke="#000" stroke-width="1"/>
      <circle cx='18' cy='14' r='6' stroke='black' stroke-width='4' fill='none'/>
      <rect x='7' y='15' width='22' height='15' rx='4' fill='black'/>
      <circle cx="18" cy="20.8" r="2.3" fill="#fff"/>
      <path d="M18 21 V26" stroke="#fff" stroke-width="2"/>
      </g>
                <g id="hidden">
      <circle cx="18" cy="18" r="17" fill="#fff" stroke="#000" stroke-width="1"/>
      <ellipse rx='14' ry='8' cx='18' cy='18' fill='#fff' stroke='black' stroke-width='1'/>
      <circle cx='18' cy='18' r='7' fill='black'/>
      <circle cx='18' cy='18' r='3' fill='#fff'/>
      <path d='M9 27 L27 9' stroke='red' stroke-width='6' opacity='.7' stroke-linecap='round'/>
      </g>    
      </defs>
    ${buf}</svg>`;
            undeScrie.innerHTML = buf;
        }
    </script>
</body>

</html>
