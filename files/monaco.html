<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monaco Editor Example</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #1e1e1e;
      color: #ffffff;
    }

    h1 {
      margin-top: 0;
      font-size: 1.5rem;
    }

    /* Container for the Monaco Editor */
    #editor-container {
      width: 100%;
      height: 500px;
      border: 1px solid #3c3c3c;
      border-radius: 6px;
      overflow: hidden;
    }
  </style>

  <!-- 1. Load RequireJS / Monaco Loader from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
</head>
<body>

  <h1>Monaco Editor Demo</h1>
  
  <!-- Editor container target -->
  <div id="editor-container"></div>

  <script>
    // 2. Configure the paths for Monaco workers and resources
    require.config({ 
      paths: { 
        vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' 
      } 
    });

    // 3. Load the main Monaco editor module
    require(['vs/editor/editor.main'], function () {
      
      // Initial code content
      const initialCode = `// Welcome to Monaco Editor!
const menu = document.getElementById('custom-menu');
const targetArea = document.getElementById('target-area');

targetArea.addEventListener('contextmenu', (e) => {
    e.preventDefault();

    const posX = e.clientX;
    const posY = e.clientY;

    menu.style.display = 'block';
});

document.addEventListener('click', (e) => {
    if (!menu.contains(e.target)) {
        menu.style.display = 'none';
    }
});

function menuAction(action) {
    menu.style.display = 'none';
}

document.addEventListener('DOMContentLoaded', () => {
  const tabButtonsContainer = document.querySelector('.tab-buttons');

  tabButtonsContainer.addEventListener('click', (event) => {
    const clickedBtn = event.target.closest('.tab-btn');
    
    // If a button wasn't clicked, do nothing
    if (!clickedBtn) return;

    // Get the target panel ID from data-tab attribute
    const targetTabId = clickedBtn.getAttribute('data-tab');

    // 1. Remove 'active' class from all buttons and panels
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.remove('active'));

    // 2. Add 'active' class to the clicked button and targeted panel
    clickedBtn.classList.add('active');
    document.getElementById(targetTabId).classList.add('active');
  });
});`;

      // 4. Create the editor instance
      const editor = monaco.editor.create(document.getElementById('editor-container'), {
        value: initialCode,      // Initial text content
        language: 'javascript',  // Syntax highlighting language
        theme: 'vs-dark',        // Options: 'vs-dark', 'vs', 'hc-black'
        automaticLayout: true,   // Automatically resizes when window or container resizes
        fontSize: 14,            // Font size in pixels
        minimap: {
          enabled: true          // Toggle code minimap sidebar
        }
      });

      // Optional: How to get the editor content later
      editor.onDidChangeModelContent(() => {
        const currentCode = editor.getValue();
        // Do something with currentCode (e.g., save or evaluate)
      });
    });
  </script>
</body>
</html>
