<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>✎ X Mini Editor</title>
<style>
    :root {
      --doc-name: "";
      --border-color: #ccc;
      --font-size: 15px;
      --page-text: "Pag.";
      --of-text: "din";
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      font-size: var(--font-size);
      background: #e9edf2;
      color: #222;
      line-height: 1.5;
    }

    .toolbar {
      position: sticky;
      top: 0;
      width: 100%;
      z-index: 100;
      overflow-x: auto;
      overflow-y: hidden;
      white-space: nowrap;
      padding: 6px;
      background: #fff;
      border-bottom: 1px solid #ccc;
      box-shadow: 0 2px 5px #00000030;

      .toolbar::-webkit-scrollbar { display: none; }
      -ms-overflow-style: none; /* IE and Old Edge */
      scrollbar-width: none; /* Firefox */
  }

    .toolbar button,
    .toolbar select {
      padding: 4px;
      font-family: Arial, sans-serif;
      border: none;
      background: #fff;
      margin: 0;
      cursor: pointer;
    }
    .toolbar select, .toolbar input { font-size: var(--font-size); vertical-align: middle; }
    .toolbar input {
      width: 160px;
      padding: 2px 6px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      outline: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toolbar button:hover,
    .toolbar select:hover {
      background: #edf2f7;
    }

    .toolbar button.active {
      background: #dceafe;
      border-color: #6699dd;
    }

    .toolbar button .material-symbols-outlined {
      font-size: 18px;
      line-height: 1;
      vertical-align: middle;
    }
    #printPdf {
      color: #fff;
      background: #1769aa;
      font-weight: bold;
      height: 24px;
      padding: 0 8px;
      border-radius: 6px;
    }

    #printPdf:hover {
      background: purple;
    }

    .separator {
      display: inline-block;
      vertical-align: middle;
      width: 1px;
      height: 24px;
      margin: 0 4px;
      background: #d3d7dd;
    }

    .workspace {
      padding: 30px 15px 60px;
    }

    .page {
    width: 210mm;
    min-height: 297mm;
    margin: 0 auto;
    padding: 15mm 30mm;
    background: #fff;
    box-shadow: 0 3px 15px #00000020;
    position: relative;
    }

@media screen and (max-width: 768px) {
  .page {
    padding: 20px 5px 10px 5px;
    transform: scale(.488);
    transform-origin: top left;
  }
  .workspace {
      padding: 0;
      overflow-x: clip;
  }
}

    #editor {
      min-height: 267mm;
      outline: none;
      font-family: Arial, sans-serif;
      font-size: var(--font-size);
      line-height: 1.5;
      overflow-wrap: break-word;
      cursor: text;
    }
    #editor blockquote {
      margin: 1em 0;
      padding: 0 0 0 24px;
      border-left: 4px solid var(--border-color);
      color: #000;
    }
    #editor table {
      width: 100%;
      border-collapse: collapse;
    }
    #editor table td {
      vertical-align: top;
    }
    #editor H1 {
      font-family: "Roboto Condensed", sans-serif;
      font-optical-sizing: auto;
      font-weight: 600;
      font-style: bold;
      font-size: 24px;
      line-height: 24px;
      margin: 0;
    }
    #editor H2 {
      font-family: "Roboto Condensed", sans-serif;
      font-optical-sizing: auto;
      font-weight: 600;
      font-style: bold;
      font-size: 20px;
      line-height: 20px;
      margin: 0;
    }
    #editor u {
      text-decoration: none;
      padding-bottom: 2px;
      border-bottom: 1px solid #000;
    }
    #editor ol li, #editor ul li {
      margin-bottom: .8em;
    }
    #editor sub, #editor sup {
      font-size: .6em;
    }
    #editor svg {
      display: inline-block;
    }
    #editor .hRule {
      border: none;
      border-top: 1px solid #000;
      height: 1px;
      width: 25%;
      margin: 0 auto;
    }
    #editor .chenar {
      border: .6px solid #000;
      padding: 1px 4px;
      margin: 0 2px;
      border-radius: 3px;
    }

    @media print {
      body {
        background: #fff;
        color: #000;
      }

      .toolbar {
        display: none !important;
      }

      .workspace {
        padding: 0 !important;
      }

      .page {
        width: 100% !important;
        min-height: auto !important;
        margin: 0 !important;
        padding: 0 !important;
        box-shadow: none !important;
      }

      #editor {
        min-height: auto !important;
      }

      @page {
        size: A4 portrait;
        margin: 15mm 30mm; /* 15mm Top/Bottom, 30mm Left/Right */
        @bottom-left {
          content: var(--doc-name);
          font-family: Arial, sans-serif;
          font-size: 12px;
          color: #000;
        }
        @bottom-right {
          /*content: "Page " counter(page) " of " counter(pages);*/
          content: var(--page-text) " " counter(page) " " var(--of-text) " " counter(pages);
          font-family: Arial, sans-serif;
          font-size: 12px;
          color: #000;
        }
      }
    }

  <div id="tableModal" class="modal-overlay" hidden>
    <div class="modal-dialog">
      <h3>Insert Table</h3>

<script>

const editorElement = document.querySelector('#editor');

document.querySelectorAll('[data-command]').forEach(button => {
      button.addEventListener('mousedown', event => event.preventDefault());
      button.addEventListener('click', () => {
        const command = button.dataset.command;
        editorElement.focus();
        document.execCommand(command, false, null);
      });
});

document.querySelectorAll('[data-sel]').forEach(button => {
      //button.addEventListener('mousedown', event => event.preventDefault());
      button.addEventListener('click', () => {
        const sel = button.dataset.sel;
        if(sel === 'UpperCase' || sel === 'LowerCase') {
          const selection = window.getSelection();
          if (!selection.isCollapsed) {
            const selectedText = selection.toString();
            const transformedText = sel === 'UpperCase' ? selectedText.toUpperCase() : selectedText.toLowerCase();
            document.execCommand('insertText', false, transformedText);
          }
        } else {
          editorElement.focus();
          document.execCommand('formatBlock', false, sel);
        }
      });
});

document.querySelector('#printPdf').addEventListener('click', () => {
  window.print();
});

document.querySelector('#docNameInput').addEventListener('change', (event) => {
  const newName = event.target.value.trim();
  document.documentElement.style.setProperty('--doc-name', `"${newName}"`);
});

document.querySelector('#titlu').addEventListener('click', () => {
  const t = `<table>
    <tr>
        <td style="border-right: 1px solid #000; padding-bottom: .6em; vertical-align: bottom;"><H1>REQUEST</H1></td>
        <td style="padding: 0 0 .6em 1em; width: 1%; white-space: nowrap;">To the enterprise<br>of the City Hall<br>in reverse order.</td>
    </tr>
    <tr>
        <td colspan="2" style="border: 1px solid #000; padding: .6em 0; text-align: center;">The description of the claim<br>to be brought before the court.</td>
    </tr>
  </table><br>`;
  editorElement.focus();
  document.execCommand('insertHTML', false, t);
});

document.querySelector('#clearAll').addEventListener('click', () => {
  editorElement.innerHTML = editorElement.textContent; // Remove all formatting but keep text
});
document.querySelector('#tableModalCancel').addEventListener('click', () => {
  tableModal.hidden = true;
});

function makeRemark(mod) {
  let svg;
  switch(mod) {
    case 'quote':
      svg = '<svg xmlns="http://www.w3.org/2000/svg" width="28" viewBox="0 0 24 24" fill="currentColor"><path d="M14.017 21v-7.391c0-5.704 3.731-9.57 8.983-10.609l.995 2.151c-2.432.917-3.995 3.638-3.995 5.849h4v10h-9.983zm-14.017 0v-7.391c0-5.704 3.748-9.57 9-10.609l.996 2.151c-2.433.917-3.996 3.638-3.996 5.849h3.983v10h-9.983z"/></svg>';
      break;
    case 'note':
      svg = '<svg xmlns="http://www.w3.org/2000/svg" height="32" viewBox="0 -960 960 960" width="24px" fill="#1f1f1f"><path d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h357l-80 80H200v560h560v-278l80-80v358q0 33-23.5 56.5T760-120H200Zm280-360ZM360-360v-170l367-367q12-12 27-18t30-6q16 0 30.5 6t26.5 18l56 57q11 12 17 26.5t6 29.5q0 15-5.5 29.5T897-728L530-360H360Zm481-424-56-56 56 56ZM440-440h56l232-232-28-28-29-28-231 231v57Zm260-260-29-28 29 28 28 28-28-28Z"/></svg>';
      break;
    case 'warning':
      svg = '<svg xmlns="http://www.w3.org/2000/svg" width="32" viewBox="0 -960 960 960" width="24px" fill="#1f1f1f"><path d="M508.5-291.5Q520-303 520-320t-11.5-28.5Q497-360 480-360t-28.5 11.5Q440-337 440-320t11.5 28.5Q463-280 480-280t28.5-11.5ZM440-440h80v-240h-80v240Zm40 360q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z"/></svg>';
      break;
    case 'bulb':
      svg = '<svg xmlns="http://www.w3.org/2000/svg" height="32" viewBox="0 -960 960 960" width="24px" fill="#1f1f1f"><path d="M480-80q-26 0-47-12.5T400-126q-33 0-56.5-23.5T320-206v-142q-59-39-94.5-103T190-590q0-121 84.5-205.5T480-880q121 0 205.5 84.5T770-590q0 77-35.5 140T640-348v142q0 33-23.5 56.5T560-126q-12 21-33 33.5T480-80Zm-80-126h160v-36H400v36Zm0-76h160v-38H400v38Zm-8-118h58v-108l-88-88 42-42 76 76 76-76 42 42-88 88v108h58q54-26 88-76.5T690-590q0-88-61-149t-149-61q-88 0-149 61t-61 149q0 63 34 113.5t88 76.5Zm88-162Zm0-38Z"/></svg>';
      break;
    case 'decision':
      svg = '<svg xmlns="http://www.w3.org/2000/svg" width="32" viewBox="0 -960 960 960" width="24px" fill="#1f1f1f"><path d="M160-120v-80h480v80H160Zm226-194L160-540l84-86 228 226-86 86Zm254-254L414-796l86-84 226 226-86 86Zm184 408L302-682l56-56 522 522-56 56Z"/></svg>';
      break;
    case 'attach':
      svg = '<svg xmlns="http://www.w3.org/2000/svg" height="32" viewBox="0 -960 960 960" width="24px" fill="#1f1f1f"><path d="M720-330q0 104-73 177T470-80q-104 0-177-73t-73-177v-370q0-75 52.5-127.5T400-880q75 0 127.5 52.5T580-700v350q0 46-32 78t-78 32q-46 0-78-32t-32-78v-370h80v370q0 13 8.5 21.5T470-320q13 0 21.5-8.5T500-350v-350q-1-42-29.5-71T400-800q-42 0-71 29t-29 71v370q-1 71 49 120.5T470-160q70 0 119-49.5T640-330v-390h80v390Z"/></svg>';
      break;
    default: svg = '>';
  }
  const t = `<table><tr>
      <td style="border-right: 1px solid #000; width: 40px;">${svg}</td>
      <td style="padding-left: 1em;">Write here.</td></tr></table><br>`;
  editorElement.focus();
  document.execCommand('insertHTML', false, t);
}

document.querySelectorAll('[data-remark]').forEach(button => {
  button.addEventListener('click', () => {
      makeRemark(button.dataset.remark);
  });
});
document.querySelector('#twoPanels').addEventListener('click', () => {
  const t = `<table><tr>
      <td style="border-right: 1px solid #000; padding-right: 1em; width: 50%;">First panel.</td>
      <td style="padding-left: 1em;">Second panel.</td></tr></table><br>`;
  editorElement.focus();
  document.execCommand('insertHTML', false, t);
});
document.querySelector('#horizontalRule').addEventListener('click', () => {
  editorElement.focus();
  document.execCommand('insertHTML', false, '<br><div class="hRule"></div><br>');
});
document.querySelector('#nbsp').addEventListener('click', () => {
  editorElement.focus();
  document.execCommand('insertHTML', false, '&nbsp;');
});
document.querySelector('#endash').addEventListener('click', () => {
  editorElement.innerHTML = editorElement.innerHTML.replace(/--/g, '&ndash;');
});
document.querySelector('#chenar').addEventListener('click', () => {
  const selection = window.getSelection();
  if (!selection.isCollapsed) {
    const selectedText = selection.toString();
    const framedText = `<span class="chenar">${selectedText}</span>`;
    document.execCommand('insertHTML', false, framedText);
  }
});
document.querySelector('#footerLang').addEventListener('click', (event) => {
  const el = event.target;
  if (el.textContent === 'RO') {
    document.documentElement.style.setProperty('--page-text', '"Page"');
    document.documentElement.style.setProperty('--of-text', '"of"');
    el.textContent = 'EN';
  } else {
    document.documentElement.style.setProperty('--page-text', '"Pag."');
    document.documentElement.style.setProperty('--of-text', '"din"');
    el.textContent = 'RO';
  }
});
document.querySelector('#tblList').addEventListener('click', () => {
  const inp = prompt('Enter rows and type 1/A (e.g., 3 1', '3 1');
  if (inp && inp.trim() !== '') {
    const parts = inp.trim().split(' ');
    if (parts.length < 1 || parts.length > 2) return;
    const rows = parseInt(parts[0], 10);
    const tip = parts[1];
    if (isNaN(rows) || (tip != '1' && tip != 'A')) return;
    const Flag = (tip == '1');
    let tableHTML = '<table>';
    for (let r = 0; r < rows; r++) {
      const svg = `<svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" width="32" viewBox="0 0 32 32">
<circle cx="16" cy="16" r="15" fill="none" stroke-width="1" stroke="#000"/>
<text x="16" y="16" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="18" fill="#000">${ Flag ? r+1 : String.fromCharCode(r + 65) }</text>
</svg>`;
      tableHTML += `<tr><td style="width: 40px;">${svg}</td><td style="padding-bottom: .8em;">Item ${r+1}</td></tr>`;
    }
    editorElement.focus();
    document.execCommand('insertHTML', false, tableHTML + '</table><br>');
  }
});
document.querySelector('#signature').addEventListener('click', () => {
  const inp = prompt('How many signatories? (1-3)', '2');
  if (inp && inp.trim() !== '') {
    let t, x = parseInt(inp, 10);
    if (isNaN(x) || x < 1 || x > 3) return;
    const sgn = '<td style="width: 20%; border-top: 1px solid #000; padding-top: .2em; line-height: 1;">Signatory,<br>position</td>';
    const spc = '<td style="width: 10%;"></td>';
    if(x == 1) t = `<table><tr>${sgn}${spc}${spc}</tr></table><br>`;
    else if(x == 2) t = `<table><tr>${sgn}${spc}${sgn}</tr></table><br>`;
    else t = `<table><tr>${sgn}${spc}${sgn}${spc}${sgn}</tr></table><br>`;
    editorElement.focus();
    document.execCommand('insertHTML', false, t);
  }
});
document.querySelector('#address').addEventListener('click', () => {
  const t = `<table><tr>
        <td><u>From:</u><br>Address,<br>Email, telephone,<br>Etc.</td>
        <td style="width: 1%;  white-space: nowrap;"><u>To:</u><br>Address,<br>Email, telephone,<br>Etc.</td>
    </tr></table><br><u>Date:</u> 1 January 2024<br>`;
  editorElement.focus();
  document.execCommand('insertHTML', false, t);
});
document.querySelector('#inlineIcon').addEventListener('click', () => {
  const inp = prompt('Icon name: ink_pen, check_circle, search, etc.', 'ink_pen');
  if (inp && inp.trim() !== '') {
    document.execCommand('insertHTML', false, `<span class="material-symbols-outlined" style="font-size: 1em;">${inp}</span> `);
  }
});
</script>
</body>
</html>
