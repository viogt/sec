<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monaco Editor Example</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #1e1e1e;
      color: #ffffff;
    }

    h1 {
      margin-top: 0;
      font-size: 1.5rem;
    }

    /* Container for the Monaco Editor */
    #editor-container {
      width: 100%;
      height: 500px;
      border: 1px solid #3c3c3c;
      border-radius: 6px;
      overflow: hidden;
    }
  </style>

  <!-- 1. Load RequireJS / Monaco Loader from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
</head>
<body>

  <h1>Monaco Editor Demo</h1>
  
  <!-- Editor container target -->
  <div id="editor-container"></div>

  <script>
    // 2. Configure the paths for Monaco workers and resources
    require.config({ 
      paths: { 
        vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' 
      } 
    });

    // 3. Load the main Monaco editor module
    require(['vs/editor/editor.main'], function () {
      
      // Initial code content
      const initialCode = `// Welcome to Monaco Editor!
function greet(name) {
    console.log(\`Hello, \${name}!\`);
}

greet('World');`;

      // 4. Create the editor instance
      const editor = monaco.editor.create(document.getElementById('editor-container'), {
        value: initialCode,      // Initial text content
        language: 'javascript',  // Syntax highlighting language
        theme: 'vs-dark',        // Options: 'vs-dark', 'vs', 'hc-black'
        automaticLayout: true,   // Automatically resizes when window or container resizes
        fontSize: 14,            // Font size in pixels
        minimap: {
          enabled: true          // Toggle code minimap sidebar
        }
      });

      // Optional: How to get the editor content later
      editor.onDidChangeModelContent(() => {
        const currentCode = editor.getValue();
        // Do something with currentCode (e.g., save or evaluate)
      });
    });
  </script>
</body>
</html>
