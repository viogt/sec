<!DOCTYPE html>
<html>
  <title>✎ Write</title>
  <head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      #txt {
        width: 100%;
        height: 100%;
        padding: 24px;
        font: normal 15px Arial, sans-serif;
        background-color: white;
        box-sizing: border-box;
        outline: none;
        resize: none;
        margin: 0px;
        border: none;
      }
      .tbl1 {
		  display: grid;
		  grid-template-columns: 60% 40%;
		  grid-gap: 10px;
      }
	.tbl2 {
		display: grid;
		grid-template-columns: 40% 60%;
		grid-gap: 10px;
	}
      #log {
        width: 100%;
        height: calc(100% - 80px);
        padding: 12px;
        font: normal 15px Arial, sans-serif;
        box-sizing: border-box;
        overflow-y: scroll;
      }
      #log p { margin: 0px; margin-bottom: 12px; padding: 0px; }
      #log p > span { color: blue; font-weight: bold; }
      #pattern {
        width:100%;
        padding: 8px 12px;
        box-sizing: border-box; 
        outline: none;
        font-size: 15px;
      }
    </style>
  </head>
<body style="padding:0px; margin:0px;">
<div id="tbl" class="tbl2">
<textarea onfocus="rem(1)" id="txt" placeholder="Write here..."></textarea>
<div id="rPanel" style="background-color: #eee;">
    <input type="text" onfocus="rem(2)" id="pattern" placeholder="RegExp accepted..." onchange="findWord(this.value)" style="background-color:#ff6;">
    <div id="log"></div>
</div>
</div>

<script>

const URLs = [
    'eng/Aggr2.txt',
    'eng/Aggr5.txt',	
    'eng/Aggr0.txt',
    'eng/Aggr3.txt',
    'eng/Aggr4.txt',
    'eng/Aggr1.txt',
    'eng/terminology.txt',
    'eng/Aggr6.txt',
    'eng/Aggr7.txt'
],
	CNTs = [];

  const log = document.getElementById('log'),
    textarea = document.getElementById('txt'),
    lookUp = document.getElementById('lookUp');

    textarea.onselect = function() {
		findWord( window.getSelection().toString() );
	};

function findWord(wrd) {
	alert(wrd);
    while(log.firstChild) log.removeChild(log.lastChild);
    var Res, Rx = new RegExp("^.*(" + wrd + ").*$",'gim');
    for(let i in CNTs) {
        while (Res = Rx.exec(CNTs[i])) {
            let parts = Res[0].split(Res[1]);

            let par = document.createElement('p'), sp = document.createElement('span');
            sp.appendChild(document.createTextNode(Res[1]));
            
            par.appendChild(document.createTextNode(parts[0]));
	        par.appendChild(sp);
	        par.appendChild(document.createTextNode(parts[1]));
	        if(parts.length > 2) for(let i=2, L = parts.length; i<L; i++) {
	            par.appendChild(sp.cloneNode(true));
	            par.appendChild(document.createTextNode(parts[i]));
	        }
	        log.appendChild(par);
        }
    }
    if(!log.firstChild) log.appendChild(document.createTextNode("<no occurence found>"));
}

function xhrFile(ix) {
    fetch(URLs[ix]).then(res => res.text())
	.then(txt => {
		CNTs.push(txt);
		if(URLs.length == CNTs.length)
			document.getElementById("pattern").style.backgroundColor = '';
	})
    .catch(err => log.innerText += err);
}

function rem(m){
	let e = document.getElementById('tbl'), x = 'tbl'+m;
	if(x != e.className) e.className = x;
}

for(let i in URLs) xhrFile(i);
document.getElementById('pattern').focus();

</script>

</body>
</html>
